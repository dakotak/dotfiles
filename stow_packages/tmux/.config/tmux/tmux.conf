########## General Options #########
# Reindex window numbers when windows are removed
set -g renumber-windows on
set -g mouse on
# Allow sending multiple tmux keys within one second without hitting the prefix key each time
# set -g repeat-time 1000
set -g base-index 1
set -g pane-base-index 1

# True color support
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

# source-file #{d:current_file}/statusbar.conf
# Status bar
# Set some variables for easy glyph refrences
# ROUND_OPEN="#(printf '\uE0B6')"
# Color pallet
CPBG="#272822"
CPFG="#F1EBEB"
CP0="#48483E"
CP1="#DC2566"
CP2="#8FC029"

ROUND_OPEN=""
ROUND_CLOSE=""
TRIANGLE_OPEN=""
TRIANGLE_CLOSE=""
BLOCK1=""
BLOCK2=""
BLOCK3=""
BLOCK4=""

set -g status-style bg=${CP0},fg=${CP1}
set -g status-position top
set -g status-justify centre
# Status bar left
set -g status-left-length 20
set -g status-left "#[bg=${CP1},fg=${CP0}] #S #[bg=default,fg=default]${BLOCK3}"
# Status bar right
set -g status-right-length 20
set -g status-right "Nice "
# Status bar center (window list)

set -g window-status-format "\
#(echo #{window_index} | tr '0-9' '⁰¹²³⁴⁵⁶⁷⁸⁹')\
#W\
#{?window_flags,#{window_flags}, }"

set -g window-status-current-format "\
#[us=green underscore]\
#(echo #{window_index} | tr '0-9' '⁰¹²³⁴⁵⁶⁷⁸⁹')\
#W\
#{?window_flags,#{window_flags}, }"

set -g window-status-separator ""

